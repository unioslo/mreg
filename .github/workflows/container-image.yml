name: Container image
on:
  push:
    branches: [master]
    tags: ['v*']
    paths-ignore:
      - 'ci/**'
      - 'README.md'
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Docker build
      run: docker build -t mreg .
    - name: Save image
      run: docker save mreg | gzip > mreg.tgz
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: mreg
        path: mreg.tgz

  test:
    name: Unit tests
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: mreg
          POSTGRES_PASSWORD: mreg
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "pg_isready --username=mreg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Map the containerized port to localhost.
          - 5432:5432
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: mreg
    - name: Load image
      run: docker load --input mreg.tgz
    - name: Run tests
      run: |
        docker run --rm -t --network host --entrypoint /app/entrypoint-test.sh \
        -e MREG_DB_HOST=localhost -e MREG_DB_PASSWORD=mreg -e MREG_DB_USER=mreg \
        mreg

  mreg-cli:
    name: Test with mreg-cli
    needs: build
    runs-on: ubuntu-latest
    env:
      # These vars are sourced by mreg-cli's `run_testsuite_and_record_V2.sh`
      # Ensures we use local image (with unique CI tag), not image pulled from registry.
      MREG_IMAGE: mreg:ci
      MREG_IMAGE_PULL_POLICY: never
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: mreg
    - name: Load container image
      run: docker load --input mreg.tgz
    - name: Tag local image for mreg-cli
      run: docker tag mreg:latest "$MREG_IMAGE"
    - name: Checkout
      uses: actions/checkout@v6
    - name: Download mreg-cli
      run: git clone https://github.com/unioslo/mreg-cli.git
    - name: Check out a previous version of mreg-cli
      if: ${{ hashFiles('ci/MREG-CLI_COMMIT') != '' }}
      run: |
        cp -r mreg-cli/ci /tmp
        C=$(cat ci/MREG-CLI_COMMIT)
        cd mreg-cli
        # A default shallow clone can contain the commit object without all of
        # its trees. Fetch the pinned revision explicitly before checkout.
        git fetch --depth=1 origin "$C"
        git -c advice.detachedHead=false checkout FETCH_HEAD
        cp --no-clobber /tmp/ci/* ci/
    - name: Run the tests
      run: mreg-cli/ci/run_testsuite_and_record_V2.sh
    - name: Comment on the commit that the tests worked
      run: |
        C=$(cd mreg-cli && git rev-parse HEAD)
        jq -nc "{\"body\": \"Works with https://github.com/unioslo/mreg-cli/commit/$C\"}" | \
        curl -sL  -X POST -d @- \
          -H "Content-Type: application/json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments"

  test-with-curl:
    name: Test with curl
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: mreg
          POSTGRES_PASSWORD: mreg
        # Set health checks to wait until postgres has started
        options: >-
          --health-cmd "pg_isready --username=mreg"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          # Map the containerized port to localhost.
          - 5432:5432
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: mreg
    - name: Load container image
      run: docker load --input mreg.tgz
    - name: Start mreg
      run: |
        docker run -t --network host --detach --name mreg \
        -e MREG_DB_HOST=localhost -e MREG_DB_PASSWORD=mreg -e MREG_DB_USER=mreg \
        mreg
    - name: Wait for mreg to become ready
      run: |
        for attempt in {1..30}; do
          if curl --silent --show-error \
            http://127.0.0.1:8000/api/meta/health/heartbeat >/dev/null; then
            exit 0
          fi
          if [ "$(docker inspect --format '{{.State.Running}}' mreg)" != "true" ]; then
            docker logs mreg
            exit 1
          fi
          sleep 2
        done
        docker logs mreg
        exit 1
    - name: Create a user
      run: docker exec -t mreg python /app/manage.py create_mreg_superuser --username test --password test123
    - name: Authenticate using curl
      shell: bash
      run: |
        curl http://127.0.0.1:8000/api/token-auth/  \
          -X POST -H "Content-Type: application/json" \
          --data "{\"username\":\"test\",\"password\":\"test123\"}" \
          --output /tmp/curl_output.txt \
          --verbose --no-progress-meter \
          --write-out %{http_code} \
          > /tmp/http_status_code.txt 2> /tmp/curl_errors.txt
        STATUS=$(cat /tmp/http_status_code.txt)
        if [ "$STATUS" != "200" ]; then
          cat /tmp/curl_output.txt
          exit 1
        fi
    - name: Show mreg logs
      if: always()
      run: docker logs mreg
    - name: Stop mreg
      if: always()
      run: docker rm --force mreg

  publish:
    name: Publish
    # Fork pull requests cannot write organization packages with GITHUB_TOKEN.
    # Publish only version tags, master commits, and same-repository pull requests.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/master' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: [test, test-with-curl]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        # Full history of all branches, so we can check whether a version tag
        # points to a commit on master (which determines the "latest" tag).
        fetch-depth: 0
    - name: Download artifact
      uses: actions/download-artifact@v8
      with:
        name: mreg
    - name: Load image
      run: docker load --input mreg.tgz
    - name: Log in to registry
      run: >
        echo "${{ secrets.GITHUB_TOKEN }}"
        | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push image
      run: |
        IMAGE_ID=ghcr.io/${{ github.repository_owner }}/mreg
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        
        # Initialize array to track published tags
        PUBLISHED_TAGS=()

        # Pull request - tag with pr-<number>
        if [[ ${{ github.event_name }} == "pull_request" ]]; then
          PR_NUMBER="${{ github.event.number }}"
          echo "::notice title=Docker Image::Publishing PR image: pr-$PR_NUMBER"
          docker tag mreg:latest $IMAGE_ID:pr-$PR_NUMBER
          docker push $IMAGE_ID:pr-$PR_NUMBER
          PUBLISHED_TAGS+=("pr-$PR_NUMBER")
        fi

        # Master branch commits - tag with master and master-<SHA>
        if [[ ${{ github.ref }} == "refs/heads/master" ]]; then
          echo "::notice title=Docker Image::Publishing master images: master-$SHORT_SHA, master"
          docker tag mreg:latest $IMAGE_ID:master-$SHORT_SHA
          docker push $IMAGE_ID:master-$SHORT_SHA
          docker tag mreg:latest $IMAGE_ID:master
          docker push $IMAGE_ID:master
          PUBLISHED_TAGS+=("master-$SHORT_SHA" "master")
        fi

        # Version tags - tag with version
        # NOTE: This can run on non-master branches, so that we can publish
        # security fixes on version branches without updating the latest tag.
        if [[ ${{ github.ref }} == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          echo "::notice title=Docker Image::Publishing version image: $VERSION"

          docker tag mreg:latest $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION
          PUBLISHED_TAGS+=("$VERSION")

          # Tags on master also update "latest"; tags on version branches do not.
          if git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "::notice title=Docker Image::Publishing latest image: latest"
            docker tag mreg:latest $IMAGE_ID:latest
            docker push $IMAGE_ID:latest
            PUBLISHED_TAGS+=("latest")
          fi
        fi

        # Generate job summary
        if [[ ${#PUBLISHED_TAGS[@]} -gt 0 ]]; then
          {
            echo "## 🐳 Published Docker Images"
            echo ""
            echo "The following tags were published to \`$IMAGE_ID\`:"
            echo ""
            for tag in "${PUBLISHED_TAGS[@]}"; do
              echo "- \`$tag\`"
            done
          } >> $GITHUB_STEP_SUMMARY
        fi
