[build-system]
requires = ["setuptools >= 68.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mreg"
requires-python = ">=3.14"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.18.1,<3.19",
    "django-auth-ldap>=5.2.0",
    "django-logging-json>=1.15",
    "django-netfields>=1.3.2",
    "django-filter>=25",
    "structlog>=25",
    "rich>=14",
    "gunicorn>=23.0.0",
    "idna>=3.11",
    "psycopg[binary,pool]>=3.3",
    "pika>=1.3.2",
    "sentry-sdk>=2.48.0",
    "tzdata>=2025.3",
    "drf-standardized-errors>=0.15",
    # For OpenAPI schema generation
    # Pinned to prevent breaking changes: https://drf-spectacular.readthedocs.io/en/latest/readme.html#release-management
    "drf-spectacular[sidecar]==0.30.0",
    # For testing inside Docker image
    "unittest-parametrize",
    "prometheus-client>=0.20",
    "tblib>=3.2.2",
    "python-dotenv>=1.2.3",
]
dynamic = ["version"]

# https://docs.astral.sh/uv/concepts/dependencies/#dependency-groups
[dependency-groups]
dev = [
    "tox-uv>=1.29",
    "coverage[toml]",
    "pytest",
    "pytest-django",
    "uv>=0.9",
    "inline-snapshot>=0.35.4",
    {include-group = "profile"},
    {include-group = "lint"},
]
ci = [
    # Explictly include dev group for non-uv package managers
    # (dev group is automatically installed with uv)
    {include-group = "dev"},
    "tox-gh-actions", 
    "coveralls",
]
profile = ["django-silk[formatting]>=5.5.0"]
lint = [
    "ruff>=0.16.9",
]

[tool.inline-snapshot]
format-command="ruff check --fix-only --stdin-filename {filename} | ruff format --stdin-filename {filename}"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mregsite.settings"
# Add/remove specific pytest test paths as needed
testpaths = ["mreg/tests/pytest_tests/**"]

[tool.ruff]
line-length = 140
exclude = ["mreg/migrations/", "hostpolicy/migrations/", ".tox"]

[tool.ruff.lint]
# https://beta.ruff.rs/docs/rules/
select = ["E", "F"]

[tool.setuptools]
py-modules = ["mreg", "mregsite", "hostpolicy"]

[tool.setuptools_scm]
version_file = "mreg/_version.py"

[tool.coverage.run]
concurrency = ["multiprocessing"]
parallel = true
sigterm = true
